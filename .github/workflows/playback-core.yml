name: Build Playback Core

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - "playback-core/**"
      - "playback-demo/**"
      - "gradle/**"
      - "settings.gradle"
      - ".github/workflows/playback-core.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK components
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          ln -sfn "$SDK/platforms/android-37.0" "$SDK/platforms/android-37" || true
          "$SDKMANAGER" "cmake;3.22.1" || true
          "$SDKMANAGER" "ndk;29.0.14206865" || true

      - name: Prepare local properties
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "sdk.dir=$SDK"
            echo "storeFile=$RUNNER_TEMP/debug.keystore"
            echo "keyAlias=androiddebugkey"
            echo "storePassword=android"
            echo "keyPassword=android"
          } > local.properties

      - name: Build playback core
        run: |
          chmod +x gradlew
          ./gradlew :playback-core:assembleDebug --no-daemon --stacktrace

      - name: Upload core AAR
        uses: actions/upload-artifact@v4
        with:
          name: playback-core-debug
          path: playback-core/build/outputs/aar/*.aar
          if-no-files-found: error

      - name: Build playback demo
        run: |
          chmod +x gradlew
          ./gradlew :playback-demo:assembleDebug --no-daemon --stacktrace

      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: playback-demo-debug
          path: playback-demo/build/outputs/apk/debug/*.apk
          if-no-files-found: error
