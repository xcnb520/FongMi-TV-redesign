name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths-ignore:
      - "website/**"
      - "design-demo/**"
      - "**.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          ln -sfn "$SDK/platforms/android-37.0" "$SDK/platforms/android-37" || true
          sdkmanager "cmake;3.22.1" || true
          sdkmanager "ndk;29.0.14206865" || true

      - name: Prepare signing config
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "sdk.dir=$SDK"
            echo "storeFile=$RUNNER_TEMP/debug.keystore"
            echo "keyAlias=androiddebugkey"
            echo "storePassword=android"
            echo "keyPassword=android"
          } > local.properties

      - name: Build mobile debug APK
        run: ./gradlew :app:assembleMobileDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-TV-mobile-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
