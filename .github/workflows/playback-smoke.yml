name: Playback Smoke

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - "playback-core/**"
      - "playback-demo/**"
      - ".github/workflows/playback-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK components
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          ln -sfn "$SDK/platforms/android-37.0" "$SDK/platforms/android-37" || true
          "$SDKMANAGER" "cmake;3.22.1" || true
          "$SDKMANAGER" "ndk;29.0.14206865" || true

      - name: Prepare local properties
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "sdk.dir=$SDK"
            echo "storeFile=$RUNNER_TEMP/debug.keystore"
            echo "keyAlias=androiddebugkey"
            echo "storePassword=android"
            echo "keyPassword=android"
          } > local.properties

      - name: Build demo APK
        run: |
          chmod +x gradlew
          ./gradlew :playback-demo:assembleDebug --no-daemon --stacktrace

      - name: Generate test media
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p media/vod media/av
          ffmpeg -y -f lavfi -i testsrc2=size=640x360:rate=30 -t 8 \
            -c:v libx264 -profile:v baseline -level 3.1 -pix_fmt yuv420p -g 30 -an media/video.mp4
          ffmpeg -y -i media/video.mp4 -c copy -f hls -hls_time 2 -hls_list_size 0 \
            -hls_segment_filename "media/vod/seg%d.ts" media/vod/index.m3u8
          ffmpeg -y -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 8 \
            -c:v libx264 -profile:v baseline -level 3.1 -pix_fmt yuv420p -g 30 \
            -c:a aac -b:a 96k -shortest media/av.mp4
          ffmpeg -y -i media/av.mp4 -c copy -f hls -hls_time 2 -hls_list_size 0 \
            -hls_segment_filename "media/av/seg%d.ts" media/av/index.m3u8
          echo "=== vod playlist ==="
          cat media/vod/index.m3u8
          echo "=== files ==="
          find media -type f | sort

      - name: Start HTTP server
        run: |
          nohup python3 -m http.server 8000 --bind 0.0.0.0 --directory media > server.log 2>&1 &
          sleep 1
          curl -sI http://127.0.0.1:8000/vod/index.m3u8 | head -1

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -u
            APK=playback-demo/build/outputs/apk/debug/playback-demo-debug.apk
            adb install -r "$APK"
            fail=0
            run_case() {
              name="$1"
              url="$2"
              adb logcat -c
              adb shell am force-stop com.fongmi.player.demo || true
              adb shell am start -W -n com.fongmi.player.demo/.MainActivity --es url "$url"
              sleep 20
              adb logcat -d > "logcat-$name.txt"
              adb exec-out screencap -p > "screen-$name.png"
              echo "=== $name first frame ==="
              if grep -q "FIRST_FRAME" "logcat-$name.txt"; then
                echo "PASS $name video"
              else
                echo "FAIL $name video"
                grep -E "PlayerCore|PlaybackDemo|AndroidRuntime" "logcat-$name.txt" | tail -80 || true
                fail=1
              fi
            }
            run_case mp4 "http://10.0.2.2:8000/video.mp4"
            run_case hls "http://10.0.2.2:8000/vod/index.m3u8"
            run_case av "http://10.0.2.2:8000/av/index.m3u8"
            echo "=== audio check ==="
            if grep -q "AudioTrack play" "logcat-av.txt"; then
              echo "PASS audio track"
            else
              echo "FAIL audio track"
              fail=1
            fi
            exit $fail

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback-smoke-logs
          path: |
            logcat-*.txt
            screen-*.png
            server.log
            media/**
          if-no-files-found: warn
