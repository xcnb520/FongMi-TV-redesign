name: Playback Smoke

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - "playback-core/**"
      - "playback-demo/**"
      - ".github/workflows/playback-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK components
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          ln -sfn "$SDK/platforms/android-37.0" "$SDK/platforms/android-37" || true
          "$SDKMANAGER" "cmake;3.22.1" || true
          "$SDKMANAGER" "ndk;29.0.14206865" || true

      - name: Prepare local properties
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "sdk.dir=$SDK"
            echo "storeFile=$RUNNER_TEMP/debug.keystore"
            echo "keyAlias=androiddebugkey"
            echo "storePassword=android"
            echo "keyPassword=android"
          } > local.properties

      - name: Build demo APK
        run: |
          chmod +x gradlew
          ./gradlew :playback-demo:assembleDebug --no-daemon --stacktrace

      - name: Generate test media
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p media/vod media/av media/late media/fmp4 media/audioonly
          ffmpeg -y -f lavfi -i testsrc2=size=640x360:rate=30 -t 8 \
            -c:v libx264 -profile:v baseline -level 3.1 -pix_fmt yuv420p -g 30 -an -movflags +faststart media/video.mp4
          ffmpeg -y -i media/video.mp4 -c copy -f hls -hls_time 2 -hls_list_size 0 \
            -hls_segment_filename "media/vod/seg%d.ts" media/vod/index.m3u8
          ffmpeg -y -f lavfi -i sine=frequency=440:sample_rate=44100 -t 8 -c:a aac -b:a 96k media/audio.m4a
          ffmpeg -y -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 8 \
            -c:v libx264 -profile:v baseline -level 3.1 -pix_fmt yuv420p -g 30 \
            -c:a aac -b:a 96k -shortest -movflags +faststart media/av.mp4
          ffmpeg -y -i media/av.mp4 -c copy -f hls -hls_time 2 -hls_list_size 0 \
            -hls_segment_filename "media/av/seg%d.ts" media/av/index.m3u8
          ffmpeg -y -i media/video.mp4 -itsoffset 2 -i media/audio.m4a -map 0:v -map 1:a -c copy -shortest media/late.mp4
          ffmpeg -y -i media/late.mp4 -c copy -f hls -hls_time 2 -hls_list_size 0 \
            -hls_segment_filename "media/late/seg%d.ts" media/late/index.m3u8
          ffmpeg -y -i media/av.mp4 -c copy -f hls -hls_time 2 -hls_list_size 0 -hls_segment_type fmp4 \
            -hls_fmp4_init_filename init.mp4 -hls_segment_filename "media/fmp4/seg%d.m4s" media/fmp4/index.m3u8
          ffmpeg -y -i media/audio.m4a -c copy -f hls -hls_time 2 -hls_list_size 0 \
            -hls_segment_filename "media/audioonly/seg%d.ts" media/audioonly/index.m3u8
          cat > media/master.m3u8 <<'EOF'
          #EXTM3U
          #EXT-X-STREAM-INF:BANDWIDTH=128000,CODECS="mp4a.40.2"
          audioonly/index.m3u8
          #EXT-X-STREAM-INF:BANDWIDTH=900000,RESOLUTION=640x360,CODECS="avc1.42c01e,mp4a.40.2"
          av/index.m3u8
          EOF
          ffprobe -v error -show_entries stream=index,codec_type,start_time -of compact media/late.mp4
          echo "=== vod playlist ==="
          cat media/vod/index.m3u8
          echo "=== files ==="
          find media -type f | sort

      - name: Start HTTP server
        run: |
          nohup python3 .github/scripts/range_server.py 8000 media > server.log 2>&1 &
          sleep 1
          curl -sI http://127.0.0.1:8000/vod/index.m3u8 | head -1

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/playback-smoke.sh

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback-smoke-logs
          path: |
            logcat-*.txt
            screen-*.png
            server.log
            media/**
          if-no-files-found: warn
